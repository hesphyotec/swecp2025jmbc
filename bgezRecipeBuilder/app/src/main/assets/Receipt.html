<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Receipt Scanner</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #ffddb4;
    }

    header {
      background: #ff8c00;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
      padding: 20px;
    }

    #camera-preview {
      width: 95%;
      max-width: 500px;
      height: 250px;
      border: 2px dashed #000000;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 18px;
      text-align: center;
    }

    #instructions {
      font-size: 16px;
      color: #555;
      text-align: center;
      max-width: 500px;
    }

    #result {
      font-size: 18px;
      color: #333;
      text-align: center;
    }

    #ingredients-list {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      min-height: 100px;
      background: #fafafa;
      font-size: 15px;
      color: #555;
    }

    footer {
      padding: 10px;
      text-align: center;
      background: #f0f0f0;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      background: #ff8c00;
      color: white;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #e68900;
      color: #000000;
    }

    .remove-btn {
      margin-left: 10px;
      background: #f44336;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      padding: 2px 6px;
    }

    .remove-btn:hover {
      background: #d32f2f;
    }

    canvas {
      display: none;
    }

    #camera-preview video,
    #camera-preview img#output {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      background: transparent;
      display: block;
    }
  </style>
</head>
<body>
  <header>Receipt Scanner</header>
  
  <main>
    <canvas id="canvas"></canvas>
    <div id="camera-preview">
      <video id="camera" autoplay="true">Camera feed will appear here</video>
      <img id="output" />
    </div>
    
    <div id="instructions">
      Position the entire receipt inside the frame and press capture.
    </div>
    
    <div id="result">Scanned text will show here</div>

    <h3>Your Ingredients</h3>
    <div id="ingredients-list">Your ingredients will appear here.</div>

    <button id="scan-btn">Capture Receipt</button>
  </main>
  
  <footer>
    <nav class="bottom-nav">
      <button onclick="location.href='Homepage.html'">Back</button>
      <button onclick="location.href='barcode.html'">Barcode</button>
      <button onclick="location.href='ScanFood.html'">Scan Food</button>
      <button onclick="location.href='Saved.html'">Ingredients</button>
      <button class="active" onclick="location.href='manual.html'">Manual</button>
    </nav>
  </footer>

  <script src='js/tesseract.js'></script>
  <script src="js/fuse.js"></script>

l', 'Grand Marnier', 'Sherry', 'Rose water', 'Mixed Spice', 'Mincemeat', 'Sweet Potatoes', 'Bread Rolls', 'Bun', 'Potatoe Buns', 'Ground Pork', 'Pork Chops', 'Yukon Gold Potatoes', 'Yellow Onion', 'Beef Stock Concentrate', 'Chicken Stock Concentrate', 'Persian Cucumber', 'Mayonnaise', 'Sriracha', 'Rhubarb', 'Pita Bread', 'Bulgur Wheat', 'Quinoa', 'Dill Pickles', 'Sesame Seed Burger Buns', 'Buns', 'Iceberg Lettuce', 'Gherkin Relish', 'Cheese Slices', 'Shortening', 'Warm Water', 'Boiling Water', 'Pickle Juice', 'Powdered Sugar', 'Kielbasa', 'Polish Sausage', 'Sauerkraut', 'Caraway Seed', 'Herring', 'Jam', 'Mulukhiyah', 'Sushi Rice', 'Figs', 'Cider', 'Beetroot', 'Sardines', 'Ciabatta', 'Buckwheat', 'Prunes'];
    const fuse = new Fuse(ingreds, { includeScore: true });

    let isReadyToCapture = true;
    let streaming = false;
    let lastPreviewUrl = null;

    navigator.mediaDevices
      .getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then((stream) => {
        video.srcObject = stream;
        video.play();
      })
      .catch((err) => {
        console.error(`Error starting camera: ${err}`);
      });

    video.addEventListener('canplay', () => {
      if (!streaming) streaming = true;
    });

    scanBtn.addEventListener('click', async (ev) => {
      ev.preventDefault();
      if (isReadyToCapture) {
        await takePicture();
      } else {
        resetCapture();
      }
    });

    async function takePicture() {
      const context = canvas.getContext('2d');

      const settings = video.srcObject?.getVideoTracks?.()[0]?.getSettings?.() || {};
      const fullWidth = video.videoWidth || settings.width || 1280;
      const fullHeight = video.videoHeight || settings.height || 720;

      canvas.width = fullWidth;
      canvas.height = fullHeight;
      context.drawImage(video, 0, 0, fullWidth, fullHeight);

      const fullBlob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));

      const previewCanvas = document.createElement('canvas');
      const pRect = cameraPreview.getBoundingClientRect();
      const pW = Math.max(1, Math.floor(pRect.width));
      const pH = Math.max(1, Math.floor(pRect.height));
      previewCanvas.width = pW;
      previewCanvas.height = pH;
      const pCtx = previewCanvas.getContext('2d');

      const vidW = video.videoWidth || fullWidth;
      const vidH = video.videoHeight || fullHeight;
      const scale = Math.min(pW / vidW, pH / vidH);
      const drawW = Math.round(vidW * scale);
      const drawH = Math.round(vidH * scale);
      const offsetX = Math.floor((pW - drawW) / 2);
      const offsetY = Math.floor((pH - drawH) / 2);
      pCtx.fillStyle = '#ffffff';
      pCtx.fillRect(0, 0, pW, pH);
      pCtx.drawImage(video, 0, 0, vidW, vidH, offsetX, offsetY, drawW, drawH);

      if (lastPreviewUrl) URL.revokeObjectURL(lastPreviewUrl);
      const previewBlob = await new Promise((resolve) => previewCanvas.toBlob(resolve, 'image/png'));
      lastPreviewUrl = URL.createObjectURL(previewBlob);
      output.src = lastPreviewUrl;

      video.style.display = 'none';
      output.style.display = 'block';
      scanBtn.textContent = 'Reset';
      isReadyToCapture = false;

      await processPicture(fullBlob);
    }

    function resetCapture() {
      video.style.display = '';
      output.style.display = 'none';
      scanBtn.textContent = 'Capture Receipt';
      isReadyToCapture = true;

      if (lastPreviewUrl) {
        URL.revokeObjectURL(lastPreviewUrl);
        lastPreviewUrl = null;
      }
      output.removeAttribute('src');
      resultDiv.textContent = 'Scanned text will show here';

      canvas.width = 0;
      canvas.height = 0;
    }

    async function processPicture(imageBlob) {
      resultDiv.textContent = 'Processing...';
      try {
        const worker = await Tesseract.createWorker('eng');
        const { data } = await worker.recognize(imageBlob);
        await worker.terminate();

        const fuzzResult = fuse.search(data.text);
        const scan = [];
        fuzzResult.forEach((result) => {
          if (result.score > 0.25) return;
          scan.push(result.item);
        });

        if (scan.length) {
          resultDiv.textContent = 'Scan results: ' + scan.join(', ');
          ingredients.push(...scan);
          localStorage.setItem('ingredients', JSON.stringify(ingredients));
          renderList();
        } else {
          resultDiv.textContent = 'No results';
        }
      } catch (err) {
        console.error('OCR error:', err);
        resultDiv.textContent = 'Error during OCR';
      }
    }

    let ingredients = JSON.parse(localStorage.getItem('ingredients')) || [];

    function renderList() {
      list.innerHTML = "";

      if (ingredients.length === 0) {
        list.textContent = "Your ingredients will appear here.";
        return;
      }

      ingredients.forEach((ingredient, index) => {
        const item = document.createElement("div");
        item.textContent = ingredient;

        const removeBtn = document.createElement("button");
        removeBtn.textContent = "✕";
        removeBtn.className = "remove-btn";

        removeBtn.onclick = () => {
          ingredients.splice(index, 1);
          localStorage.setItem("ingredients", JSON.stringify(ingredients));
          renderList();
        };

        item.appendChild(removeBtn);
        list.appendChild(item);
      });
    }
    renderList();
    document.addEventListener('visibilitychange', function (event) {
        if(document.hidden){
          sessionStorage.setItem("ingredients", JSON.stringify(ingredients));
          console.log("Page is unloading (possibly reloading)");
          sock.close(1000, "Disconnecting from Receipt server");
        }
        if(!document.hidden && sock.readyState === WebSocket.CLOSED){
          sock = new WebSocket(`ws://${window.location.hostname}:18080/inventory`);
          console.log("Reopened Receipt WS");
        }
      });

    sock.onerror = (e) =>{
        console.error('error', e);
      }

      sock.onclose = (e) =>{
        console.log('close', e);
      }
  </script>
