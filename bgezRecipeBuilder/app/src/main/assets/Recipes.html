<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recommended Recipes</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffddb4;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #ff8c00;
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.4em;
      font-weight: bold;
    }

    header .title {
      margin-right: 20px;
    }

    .header-buttons button {
      background: none;
      border: 2px solid white;
      padding: 4px 6px;
      margin-left: 10px;
      border-radius: 6px;
      color: white;
      font-size: 1.1em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .header-buttons button:hover {
      background: white;
      color: #ff8c00;
    }

    main {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .recipe-card {
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      margin-bottom: 15px;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .recipe-card:hover {
      transform: scale(1.02);
    }

    .recipe-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .recipe-content {
      padding: 12px;
    }

    .recipe-title {
      font-size: 1.2em;
      margin: 0 0 8px 0;
      color: #4b2e05;
    }

    .recipe-description {
      font-size: 0.95em;
      color: #333;
    }

    @media (min-width: 600px) {
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
      }
    }
  </style>
  <script src ="js/config.js"></script>
</head>
<body>
  <header>Recommended Recipes</header>

  <body>

  <!-- HEADER WITH NAV BUTTONS -->
  <header>
    <span class="title">Recommended Recipes</span>
    <div class="header-buttons">
      <button onclick="location.href='Homepage.html'">🏚️</button>
      <button onclick="location.href='Saved.html'">🥣</button>
      <button onclick="location.href='Account.html'">🙍🏾</button>
    </div>
  </header>

  <main id="recipes-container"></main>

</body>
<footer>
  <script>
    const recipeList = document.getElementById("recipes-container");
    const loadingMsg = document.createElement("p");
    loadingMsg.textContent = "Loading recommendations...";
    loadingMsg.className = "loading";
    recipeList.appendChild(loadingMsg);

    // Connect to your Crow WebSocket server
    var socket = new WebSocket(`${CONFIG.IP}:18080/recipes`);

    socket.onopen = () => {
        console.log("Connected to recommendation server");

        if(localStorage.getItem("recipeCache") !== 'null' || localStorage.getItem("ingredientCache") !== 'null' && localStorage.getItem("pref") !== 'null'){
          console.log("All have values");
          if(localStorage.getItem("ingredientCache") === localStorage.getItem("ingredients") && localStorage.getItem("prefCache") === localStorage.getItem("checked")){
              console.log("using cache");
              cacheData = JSON.parse(localStorage.getItem("recipeCache"));
              recipeList.innerHTML = ""; // clear loading text
              cacheData.recipes.forEach(recipe => {
              const card = document.createElement("div");
              card.className = "recipe-card";
              card.innerHTML = `
                  <img src="${recipe.image}" alt="${recipe.name}" onclick="getIns(this)" style="width:100%;border-radius:8px;margin-bottom:10px;">
                  <h3>${recipe.name}</h3>
              `;
              recipeList.appendChild(card);
          });
          return;
        }
      }
        // Request recipes — backend already knows user id
        socket.send(JSON.stringify({
            op: "getrecipes",
            uid: localStorage.getItem("activeuserid")
        }));
    };

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        recipeList.innerHTML = ""; // clear loading text
        console.log(data.status);
        if (data.status !== "success" || !data.recipes || data.recipes.length === 0) {
            recipeList.innerHTML = "<p>No recipes found.</p>";
            return;
        }

        // Display each recommended recipe
        data.recipes.forEach(recipe => {
            const card = document.createElement("div");
            card.className = "recipe-card";
            card.innerHTML = `
                <img src="${recipe.image}" alt="${recipe.name}" onclick="getIns(this)" style="width:100%;border-radius:8px;margin-bottom:10px;">
                <h3>${recipe.name}</h3>
            `;
            recipeList.appendChild(card);
        });
        localStorage.setItem("recipeCache", JSON.stringify(data));
        localStorage.setItem("ingredientCache", localStorage.getItem("ingredients"));
        localStorage.setItem("prefCache", localStorage.getItem("checked"));
    };

    socket.onerror = (error) => {
        console.error("WebSocket error:", error);
        recipeList.innerHTML = "<p>Error loading recommendations.</p>";
    };

    function getIns(element) {
      socket.send(JSON.stringify({
        op: "getInstructions",
        name: element.alt
      }));

        socket.onmessage = (event) => {
        const instructions = JSON.parse(event.data)[0];
        if (!instructions || !instructions.ingredients || !instructions.instructions) {
            recipeList.innerHTML = "<p>No instructions.</p>";
            return;
        }

        localStorage.setItem("instruction", JSON.stringify(instructions));
        localStorage.setItem("recName", JSON.stringify(element.alt));
        localStorage.setItem("recImage", JSON.stringify(element.src))
        window.open("Instructions.html", "_self")
      }
    };

    socket.onclose = () => {
        console.log("Disconnected from recommendation server");
    };
</script>
</footer>
</html>
