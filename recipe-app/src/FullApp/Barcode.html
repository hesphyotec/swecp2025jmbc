      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      background: #ff8c00;
      color: white;
      transition: background 0.2s ease;

    button:hover {

    .remove-btn {

      background: #f44336;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      padding: 2px 6px;

    .remove-btn:hover {

    let scanning = false;

    var sock = new WebSocket(`ws://${window.location.hostname}:18080/inventory`);
    let ingredients = JSON.parse(sessionStorage.getItem("ingredients")) || [];

    window.addEventListener('load', function () {
      let deviceId;
      const codeReader = new ZXing.BrowserMultiFormatReader()
      codeReader.listVideoInputDevices()
        .then((videoInputDevices) => {
          deviceId = videoInputDevices[0].deviceId
        })
        scanBtn.addEventListener("click", () => {
          if (!scanning) {
            scanning = true;
            scanBtn.textContent = "Stop Scan"
            resultDiv.textContent = "Scanned code will show here"
            codeReader.decodeFromVideoDevice(deviceId, 'scanner-preview', (result, err) => {
              if (result) {
                scanning = false;
                codeReader.reset()
                scanBtn.textContent = "Start Scan"
                resultDiv.textContent = "Identified barcode: " + result.text
                lookupItem(result.text)
              }
            })
          } else {
            scanning = false;
            scanBtn.textContent = "Start Scan"
            resultDiv.textContent = "Scanned code will show here"
            codeReader.reset()
          }
        });
    })

    async function fetchProduct(barcode, timeout = 8000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const resp = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json?fields=product_name,brands`, {
          signal: controller.signal
        });
        clearTimeout(id);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = await resp.json();
        if (!json || !json.product) throw new Error('Malformed product response');
        return json.product;
      } catch (err) {
        clearTimeout(id);
        throw err;
      }
    }

    async function lookupItem(barcode) {
      try {
          resultDiv.textContent = 'Looking up product...';
          // Timeout for fetch
          const controller = new AbortController();
          const timeoutMs = 10000;
          const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

          const response = await fetch(
            `https://world.openfoodfacts.org/api/v2/product/${barcode}.json?fields=product_name,brands`,
            { signal: controller.signal }
          );
          clearTimeout(timeoutId);

          if (!response.ok) {
            resultDiv.textContent = `Product lookup failed (${response.status})`;
            return;
          }

          const data = await response.json();
          const product = data && data.product;
          if (!product) {
            resultDiv.textContent = 'Product not found';
            return;
          }

          const productName = (product.product_name || '').trim();
          const brands = (product.brands || '').trim();
          resultDiv.textContent = `API Response: ${brands} ${productName}`;

          if (!productName) {
            resultDiv.textContent = 'Product name not available';
            return;
          }

          // Proper fuse.search usage and guard result
          const fuseResults = fuse.search(productName, { limit: 1 });
          if (!fuseResults || fuseResults.length === 0) {
            resultDiv.textContent = 'Item could not be matched';
            return;
          }

          const fuzzResult = fuseResults[0];
          if (!fuzzResult || typeof fuzzResult.score !== 'number') {
            resultDiv.textContent = 'No valid match';
            return;
          }

          if (fuzzResult.score > 0.25) {
            resultDiv.textContent = 'Item could not be matched';
            return;
          }

          resultDiv.textContent = `Detected item: ${fuzzResult.item}`;

          ingredients.push({name: fuzzResult.item, id : Date.now()});
          const sendData = {
              op : "additem",
              uid : localStorage.getItem("activeuserid"),
              name : fuzzResult.item
          };
          const stringData = JSON.stringify(sendData);
          try {
            sessionStorage.setItem('ingredients', JSON.stringify(ingredients));
          } catch (e) {
            console.error('Failed to save ingredients', e);
          }
          renderList();
        } catch (error) {
          if (error.name === 'AbortError') {
            resultDiv.textContent = 'Product lookup timed out';
          } else {
            console.error('Error fetching data: ', error);
            resultDiv.textContent = 'Error fetching product';
          }
        }
      }

    

    function renderList() {
      list.innerHTML = "";

      if (ingredients.length === 0) {
        list.textContent = "Your ingredients will appear here.";
        return;
      }

      ingredients.forEach((ingredient, index) => {
        const item = document.createElement("div");
        item.textContent = ingredient.name;

        const removeBtn = document.createElement("button");
        removeBtn.textContent = "✕";
        removeBtn.className = "remove-btn";

        removeBtn.onclick = () => {
          ingredients.splice(index, 1);
          localStorage.setItem("ingredients", JSON.stringify(ingredients));
          renderList();
        };

        item.appendChild(removeBtn);
        list.appendChild(item);
      });
    }

    renderList();

    document.addEventListener('visibilitychange', function (event) {
      if(document.hidden){
        sock.close(1000, "Disconnecting from Barcode server");
      }
      if(!document.hidden && sock.readyState === WebSocket.CLOSED){
          sock = new WebSocket(`ws://${window.location.hostname}:18080/inventory`);
          console.log("Reopened Barcode WS");
      }
    });
