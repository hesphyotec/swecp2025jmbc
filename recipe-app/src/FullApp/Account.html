<!DOCTYPE html>

    <head>

        <title>Account</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                height: 100vh;
                background-color: #ffddb4;
                }
            header {
                background: #ff8c00;
                color: white;
                padding: 15px;
                text-align: center;
                font-size: 20px;
                }
            main {
                flex: 1;

                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                padding: 20px;
                }
            main h1 {
                margin: 0 0 10px 0;      
                font-size: 20px;
                font-weight: bold;
                color: black;          
                text-align: center;
                border-bottom: 2px solid black;
                padding-bottom: 5px;
            }
            footer {
                padding: 10px;
                text-align: center;
                background: white;
                }
            button{
                padding: 10px 20px;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                cursor: pointer;
                background: #ff8c00;
                color: white;
                transition: background 0.2s ease;
            }
            .user-preferences {
                height: 200px;
                width: 400px;
                overflow: auto;
                border: 2px solid black;
                border-radius: 10px;
                padding: 10px;
                align-items: left;
                display: flex;
                flex-direction: column;
                text-align: left;
                gap: 10px;

            }
            
            .check-item {
                align-items: center;
                gap: 8px;
                font-size: 16px;
                cursor: pointer;
                display: flex;
                }
            .check-item input[type="checkbox"] {
                width: 18px;
                height: 18px;
                cursor: pointer;
            }
            .account-info {
                width: 300px;
                border: 2px solid black;
                border-radius: 10px;
                padding: 15px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                background: #f9f9f9;
            }

            .account-info label {

                flex-direction: column;
                font-size: 16px;
                text-align: left;
                gap: 4px;
            }

            .account-info input {
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 14px;
            }

    <footer>
        <nav class="bottom-nav">
            <button onclick="location.href='Homepage.html'">Back</button>
            <button class="active" onclick="location.href='Saved.html'">Saved</button>
        </nav>
    </footer>
    <script>
        var socket = new WebSocket(`ws://${window.location.hostname}:18080/Account`);
        socket.onopen = () => {
        console.log("Connected to Account server");

        socket.send(JSON.stringify({
            op: "load",
            uid: localStorage.getItem("activeuserid"),
        }));

        socket.onmessage = (m) => {
            result = JSON.parse(m.data);
            if (result){
                result.forEach(value => {
                document.querySelector(`[value="${value}"]`).checked = true;
                });
            }
        }

        const checkedValues = JSON.parse(sessionStorage.getItem("checked"));
        if (checkedValues){
            checkedValues.forEach(value => {
                document.querySelector(`[value="${value}"]`).checked = true;
                });
        }
        };
        
        document.addEventListener('visibilitychange', function (event) {
            if(document.hidden){
            const checkboxes = document.querySelectorAll('input[class="check-item"]:checked');
            const checkedValues = [];

            checkboxes.forEach(checkbox => {
            checkedValues.push(checkbox.value);
            });
        
            sessionStorage.setItem("checked", JSON.stringify(checkedValues));

            socket.send(JSON.stringify({
                op: "save",
                uid: localStorage.getItem("activeuserid"),
                saved : checkedValues
            }));
            socket.close(1000, "Disconnecting from Account server");
        }
        if(!document.hidden && socket.readyState === WebSocket.CLOSED){
            socket = new WebSocket(`ws://${window.location.hostname}:18080/Account`);
            console.log("Reopened Account WS");
        }
    });
    socket.onclose = () => {
        console.log("Disconnected from Account server");
        };
    </script>
