<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved Ingredients</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }
    header {
        background: #4CAF50;
        color: white;
        padding: 15px;
        text-align: center;
        font-size: 20px;
    }
    main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 20px;
        overflow-y: auto;
    }
    main h2 {
        margin: 0 0 10px 0;
        font-size: 20px;
        font-weight: bold;
        color: #4CAF50;
        text-align: center;
        border-bottom: 2px solid #4CAF50;
        padding-bottom: 5px;
        width: 100%;
        max-width: 300px;
    }
    .status-indicator {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 4px;
        margin-bottom: 10px;
    }
    .status-online {
        background: #d4edda;
        color: #155724;
    }
    .status-offline {
        background: #fff3cd;
        color: #856404;
    }
    /* Ingredients Box */
    .ingredients-list {
        width: 300px;
        max-height: 400px;
        overflow-y: auto;
        border: 2px solid black;
        border-radius: 10px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #f9f9f9;
    }
    .ingredient-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: white;
        font-size: 16px;
    }
    .remove-btn {
        background: #e74c3c;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        padding: 2px 6px;
    }
    .remove-btn:hover {
        background: #c0392b;
    }
    /* Bottom navigation bar */
    footer {
        display: flex;
        justify-content: space-around;
        background: #f0f0f0;
        padding: 12px;
        border-top: 2px solid #ccc;
    }
    footer button {
        flex: 1;
        margin: 0 8px;
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background: #4CAF50;
        color: white;
        cursor: pointer;
    }
    footer button:hover {
        background: #388E3C;
    }
</style>
<script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>
</head>
<body>
<header>My Ingredients</header>
<main>
    <h2>Saved Ingredients</h2>
    <div class="status-indicator" id="statusIndicator">Loading...</div>
    <div class="ingredients-list" id="ingredientsList">
        <div>Loading ingredients...</div>
    </div>
</main>
<!-- Bottom Navigation -->
<footer>
    <button onclick="location.href='Homepage.html'">Back</button>
    <button onclick="location.href='Manual.html'">Manual</button>
    <button onclick="location.href='Barcode.html'">Barcode</button>
    <button onclick="location.href='ScanFood.html'">Scan Food</button>
    <button onclick="location.href='Receipt.html'">Receipt</button>
</footer>
<script>
    const list = document.getElementById("ingredientsList");
    const statusIndicator = document.getElementById("statusIndicator");
    let ingredients = [];
    // Socket Handling
    
    var sock = new WebSocket(`ws://${window.location.hostname}:18080/inventory`);

    // Load ingredients from persistent storage
    async function loadFromStorage() {
        try {
            const result = await window.storage.get(STORAGE_KEY);
            if (result && result.value) {
                ingredients = JSON.parse(result.value);
                console.log('Loaded ingredients from storage:', ingredients);
            }
        } catch (error) {
            console.log('No stored ingredients found or error loading:', error);
            ingredients = [];
        }
        renderList();
    }

    // Save ingredients to persistent storage
    async function saveToStorage() {
        try {
            await window.storage.set(STORAGE_KEY, JSON.stringify(ingredients));
            console.log('Saved ingredients to storage');
        } catch (error) {
            console.error('Error saving to storage:', error);
        }
    }

    // Update status indicator
    function updateStatus(connected) {
        isServerConnected = connected;
        if (connected) {
            statusIndicator.textContent = '🟢 Connected to server';
            statusIndicator.className = 'status-indicator status-online';
        } else {
            statusIndicator.textContent = '🟡 Offline mode (data saved locally)';
            statusIndicator.className = 'status-indicator status-offline';
        }
    }

    // Initialize WebSocket connection
    function initWebSocket() {
        try {
            sock = new WebSocket("ws://localhost:18080/inventory");
            
            sock.onopen = () => {
                console.log('WebSocket connected');
                updateStatus(true);
                const getlist = {
                    op: "getlist",
                    uid: localStorage.getItem("activeuserid")
                };
                sock.send(JSON.stringify(getlist));
            };
            
            sock.onmessage = async (m) => {
                console.log('WebSocket message received');
                var result;
                try {
                    result = JSON.parse(m.data);
                } catch (err) {
                    console.error("JSON parse failed:", err, m.data);
                    return;
                }
                
                if (result.status === "success") {
                    if (Array.isArray(result.data)) {
                        ingredients = result.data;
                        // Sync to persistent storage
                        await saveToStorage();
                        renderList();
                    }
                } else {
                    alert("Failed to process request. Reason: " + result.message);
                }
            };
            
            sock.onerror = (e) => {
                console.error('WebSocket error', e);
                updateStatus(false);
            };
            
            sock.onclose = (e) => {
                console.log('WebSocket closed', e);
                updateStatus(false);
            };
        } catch (error) {
            console.error('Failed to initialize WebSocket:', error);
            updateStatus(false);
        }
    }

    // Render ingredients list
    function renderList() {
        list.innerHTML = "";
        
        if (ingredients.length === 0) {
            list.textContent = "Your ingredients will appear here.";
            return;
        }
        
        ingredients.forEach((ingredient) => {
            const item = document.createElement("div");
            item.className = "ingredient-item";
            
            const name = ingredient.name || ingredient;
            item.textContent = name;
            
            const removeBtn = document.createElement("button");
            removeBtn.textContent = "❌";
            removeBtn.className = "remove-btn";
            removeBtn.onclick = () => removeIngredient(ingredient);
            
            item.appendChild(removeBtn);
            list.appendChild(item);
        });
    }

    // Remove ingredient
    async function removeIngredient(ingredient) {
        if (isServerConnected && sock && sock.readyState === WebSocket.OPEN) {
            // Try to remove from server
            const sendData = {
                op: "delitem",
                uid: localStorage.getItem("activeuserid"),
                iid: ingredient.id
            };
            sock.send(JSON.stringify(sendData));
        } else {
            // Remove locally
            const index = ingredients.findIndex(ing => 
                (ing.id && ing.id === ingredient.id) || 
                (ing.name && ing.name === ingredient.name) ||
                ing === ingredient
            );
            
            if (index !== -1) {
                ingredients.splice(index, 1);
                await saveToStorage();
                renderList();
            }
        }
    }

    // Initialize on page load
    async function init() {
        await loadFromStorage();
        initWebSocket();
    }

    // Start initialization
    init();

    // Handle page unload
    window.addEventListener('beforeunload', () => {
        if (sock && sock.readyState === WebSocket.OPEN) {
            sock.close();
        }
    });
</script>
</body>
</html>
