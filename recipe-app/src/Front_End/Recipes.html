<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recommended Recipes</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #d2b48c; /* light brown background */
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #8b5e3c; /* darker brown for contrast */
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 1.4em;
      font-weight: bold;
    }

    main {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .recipe-card {
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      margin-bottom: 15px;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .recipe-card:hover {
      transform: scale(1.02);
    }

    .recipe-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .recipe-content {
      padding: 12px;
    }

    .recipe-title {
      font-size: 1.2em;
      margin: 0 0 8px 0;
      color: #4b2e05;
    }

    .recipe-description {
      font-size: 0.95em;
      color: #333;
    }

    nav {
      background-color: #8b5e3c;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0;
    }

    nav button {
      background: none;
      border: none;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: color 0.2s;
    }

    nav button:hover {
      color: #ffe4b5;
    }

    @media (min-width: 600px) {
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
      }
    }
  </style>
</head>
<body>
  <header>Recommended Recipes</header>

  <main id="recipes-container">

  </main>

  <nav>
    <button onclick="location.href='Homepage.html'">Home</button>
    <button onclick="location.href='Saved.html'">Ingredients</button>
    <button onclick="location.href='account.html'">Account</button>
  </nav>
</body>
<footer>
  <script>
    const recipeList = document.getElementById("recipes-container");
    const loadingMsg = document.createElement("p");
    loadingMsg.textContent = "Loading recommendations...";
    loadingMsg.className = "loading";
    recipeList.appendChild(loadingMsg);

    // Connect to your Crow WebSocket server
    const socket = new WebSocket("ws://localhost:18080/recipes");

    socket.onopen = () => {
        console.log("Connected to recommendation server");

        // Request recipes — backend already knows user id
        socket.send(JSON.stringify({
            op: "getrecipes",
            uid: localStorage.getItem("activeuserid")
        }));
    };

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        recipeList.innerHTML = ""; // clear loading text
        console.log(data.status);
        if (data.status !== "success" || !data.recipes || data.recipes.length === 0) {
            recipeList.innerHTML = "<p>No recipes found.</p>";
            return;
        }

        // Display each recommended recipe
        data.recipes.forEach(recipe => {
            const card = document.createElement("div");
            card.className = "recipe-card";
            card.innerHTML = `
                <img src="${recipe.image}" alt="${recipe.name}" onclick="getIns(this)" style="width:100%;border-radius:8px;margin-bottom:10px;">
                <h3>${recipe.name}</h3>
            `;
            recipeList.appendChild(card);
        });
    };

    socket.onerror = (error) => {
        console.error("WebSocket error:", error);
        recipeList.innerHTML = "<p>Error loading recommendations.</p>";
    };

    function getIns(element) {
      socket.send(JSON.stringify({
        op: "getInstructions",
        name: element.alt
      }));

        socket.onmessage = (event) => {
        const instructions = JSON.parse(event.data)[0];
        if (!instructions || !instructions.ingredients || !instructions.instructions) {
            recipeList.innerHTML = "<p>No instructions.</p>";
            return;
        }
        localStorage.setItem("instruction", JSON.stringify(instructions));
        window.open("Homepage.html", "_self")
          
        if(localStorage.getItem("instruction") !== null){
          const instruction = JSON.parse(localStorage.getItem('instruction'));
          console.log(instruction.instructions);
          console.log(instruction.ingredients);
          localStorage.removeItem('myKey');
        }
      }
    };

    socket.onclose = () => {
        console.log("Disconnected from recommendation server");
    };
</script>
</footer>
</html>
